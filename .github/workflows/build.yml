
name: Build Mazowsze Bakery APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'mazowsze-bakery-android-starter.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir -p /tmp/mazowsze
          unzip mazowsze-bakery-android-starter.zip -d /tmp/mazowsze
          cp -R /tmp/mazowsze/app .
          cp /tmp/mazowsze/*.gradle.kts .
          cp /tmp/mazowsze/gradle.properties .
          
      - name: Set Java and Kotlin targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          marker = '    buildFeatures { compose = true }'
          addition = """    compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }
          kotlinOptions {
              jvmTarget = "17"
          }
          """
          if "compileOptions {" not in s:
              s = s.replace(marker, addition + marker)
          p.write_text(s)
          PY  
          
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mazowsze-Bakery-APK
          path: app/build/outputs/apk/debug/app-debug.apk
        
        
